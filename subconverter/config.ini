; ============================================================================
; EdgeTunnel 2.1 订阅转换配置文件（subconverter remote config）
; 用法：把本文件 raw 地址填入 EdgeTunnel 后台「订阅转换配置」的配置文件地址(SUBCONFIG)
;   https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/subconverter/config.ini
; 结构：全局自动 + 各国家自动测速 + 手动选择；测速走 Cloudflare 204。
; ============================================================================
[custom]
; 完整 Mihomo 运行底座：保留 DNS/端口，并注入 TUN；~ 占位符由 subconverter 填入节点、策略组和规则。
clash_rule_base=https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/subconverter/mihomo-base.yaml

; ---- 分流规则（从上到下依次匹配）----
; 高优先级应用规则必须位于 GEOIP,CN 前面：例如 ios.chat.openai.com 即使解析到中国 IP，也会走 🎓 学术/AI。
ruleset=🎓 学术/AI,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/refs/heads/main/rule-sets/academic.list
ruleset=🌍 媒体/社交,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/refs/heads/main/rule-sets/media.list
ruleset=🌐 Google/Apple,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/refs/heads/main/rule-sets/google.list
ruleset=🇨🇳 国内,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/refs/heads/main/rule-sets/cn.list
ruleset=🇨🇳 国内,[]GEOIP,CN
ruleset=🕸️ 漏网之鱼,[]FINAL

; ---- 自动与手动（显示顺序第一层）----
; 自动选择：全部节点 url-test，实际自动测速出口；Mixin 的 OpenAI 规则直接指向此组。
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
; 自动：扁平选择器，可选择自动选择、手动、国内或各国家自动测速组。
custom_proxy_group=🚀 自动`select`[]♻️ 自动选择`[]🎯 手动`[]🇨🇳 国内`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰
; 手动：可选自动选择、各国家自动，且 .* 会列出全部原始节点供逐个选择。
custom_proxy_group=🎯 手动`select`[]♻️ 自动选择`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰`.*

; ---- 应用分流组（显示顺序第二层）----
custom_proxy_group=🇨🇳 国内`select`[]DIRECT
custom_proxy_group=🌍 媒体/社交`select`[]🚀 自动`[]🎯 手动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰
custom_proxy_group=🌐 Google/Apple`select`[]🚀 自动`[]🎯 手动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰
custom_proxy_group=🎓 学术/AI`select`[]🚀 自动`[]🎯 手动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰
custom_proxy_group=🕸️ 漏网之鱼`select`[]🚀 自动`[]🎯 手动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇩🇪 德国`[]🇳🇱 荷兰

; ---- 各国家自动测速组（显示顺序第三层）----
custom_proxy_group=🇯🇵 日本`url-test`(?i)日本|jp`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)新加坡|sg`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)美国|us`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇩🇪 德国`url-test`(?i)德国|de`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇳🇱 荷兰`url-test`(?i)荷兰|nl`https://cp.cloudflare.com/generate_204`300,,50
enable_rule_generator=true
overwrite_original_rules=true
