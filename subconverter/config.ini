; ============================================================================
; EdgeTunnel 2.1 订阅转换配置文件（subconverter remote config）
; 用法：把本文件 raw 地址填入 EdgeTunnel 后台「订阅转换配置」的配置文件地址(SUBCONFIG)
;   https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/subconverter/config.ini
; 结构：业务组 → 🚀自动 / 🌏国家 / 🎯手动；测速走 Cloudflare 204；国家池按节点名正则
; ============================================================================
[custom]
; 完整 Mihomo 运行底座：保留 DNS/端口，并注入 TUN；~ 占位符由 subconverter 填入节点、策略组和规则。
clash_rule_base=https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/subconverter/mihomo-base.yaml
; 不要随意改变关键字，否则会导致出错
; edgetunnel-rules 规则端

; ---- 分流规则（从上到下依次匹配）----
ruleset=🇨🇳 国内,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/rule-sets/cn.list
ruleset=🇨🇳 国内,[]GEOIP,CN
ruleset=🎓 学术/AI,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/rule-sets/academic.list
ruleset=🌍 媒体/社交,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/rule-sets/media.list
ruleset=🌐 Google/Apple,https://raw.githubusercontent.com/hinemo/edgetunnel-rules/main/rule-sets/google.list
ruleset=🕸️ 漏网之鱼,[]FINAL

; ---- 三级代理组：业务组 ----
custom_proxy_group=🇨🇳 国内`select`[]DIRECT
custom_proxy_group=🌍 媒体/社交`select`[]🚀 自动`[]🌏 国家`[]🎯 手动-媒体
custom_proxy_group=🌐 Google/Apple`select`[]🚀 自动`[]🌏 国家`[]🎯 手动-Google
custom_proxy_group=🎓 学术/AI`select`[]🚀 自动`[]🌏 国家`[]🎯 手动-学术
custom_proxy_group=🕸️ 漏网之鱼`select`[]🚀 自动`[]🌏 国家`[]🎯 手动-漏网

; ---- L2 模式：🚀 自动（全节点 url-test，CF 204，300s，容差 50ms）----
custom_proxy_group=🚀 自动`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

; ---- L2 模式：🌏 国家（国家内 url-test）----
custom_proxy_group=🌏 国家`select`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇭🇰 香港
custom_proxy_group=🇯🇵 日本`url-test`(?i)日本|jp`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)新加坡|sg`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)美国|us`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(?i)香港|hk`https://cp.cloudflare.com/generate_204`300,,50

; ---- L2 模式：🎯 手动（select → fallback 主→自动）
; 说明：subconverter 的 fallback 只能按一个正则过滤节点。默认用「主国家」正则实现
;       该国节点内故障转移；把 (?i)日本|jp 改成具体节点名正则（如 (?i)日本 01|JP01）
;       即为主节点优先。更完整的 主→备1→备2→自动 链需要生成器（见 template/）。----
custom_proxy_group=🎯 手动-媒体`select`[]🛟 手动HA-媒体`[]🚀 自动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇭🇰 香港
custom_proxy_group=🛟 手动HA-媒体`fallback`(?i)日本|jp`https://cp.cloudflare.com/generate_204`300
custom_proxy_group=🎯 手动-Google`select`[]🛟 手动HA-Google`[]🚀 自动`[]🇸🇬 新加坡`[]🇯🇵 日本`[]🇺🇸 美国`[]🇭🇰 香港
custom_proxy_group=🛟 手动HA-Google`fallback`(?i)新加坡|sg`https://cp.cloudflare.com/generate_204`300
custom_proxy_group=🎯 手动-学术`select`[]🛟 手动HA-学术`[]🚀 自动`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港
custom_proxy_group=🛟 手动HA-学术`fallback`(?i)美国|us`https://cp.cloudflare.com/generate_204`300
custom_proxy_group=🎯 手动-漏网`select`[]🛟 手动HA-漏网`[]🚀 自动`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇭🇰 香港
custom_proxy_group=🛟 手动HA-漏网`fallback`(?i)日本|jp`https://cp.cloudflare.com/generate_204`300

enable_rule_generator=true
overwrite_original_rules=true
