# Mihomo base injected by subconverter before proxies / proxy-groups / rules.
# This is intentionally a complete local client runtime base, not a ruleset.
dns:
  enable: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  use-hosts: true
  nameserver:
    - https://sm2.doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - 8.8.4.4
    - 208.67.220.220
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.1/32
      - 0.0.0.0/32
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
  nameserver-policy:
    'ed.dys.qzz.io': https://dns.alidns.com/dns-query
    'cloudflare-ech.com': https://dns.alidns.com/dns-query

port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# Required when the client launches Mihomo in TUN mode. Without this block,
# Mihomo has no TUN device to create and the GUI waits until it times out.
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true

proxies: ~
proxy-groups: ~
rules: ~
