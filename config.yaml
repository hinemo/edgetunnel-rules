# ============================================================================
# edgetunnel-rules 规则元数据
# EdgeTunnel 2.1 节点 + 本文件定义的分流规则 → 统一 Mihomo/Nikki 订阅
# ============================================================================

meta:
  name: edgetunnel-rules
  version: "2.0"
  description: EdgeTunnel 2.1 节点的分流规则与代理组结构（规则端，GEOSITE 为主）

# 统一测速 / 健康检查（走完整 VLESS+XHTTP+Cloudflare 代理链路）
health:
  url: https://cp.cloudflare.com/generate_204
  interval: 300        # 秒
  tolerance: 50        # ms，避免微小抖动导致乒乓切换

# 业务代理组 + 规则评估顺序（从上到下依次匹配）
# 规则生成方式：
#   1. geosite 类目 → 生成 GEOSITE,<类目>,<组名> 规则（一条顶几百条，随 geosite.dat 自动更新）
#   2. files 补充 .list → 生成 DOMAIN-SUFFIX/DOMAIN/full:/keyword: 规则（仅 geosite 未覆盖部分）
#   cn 组额外：生成 GEOIP,CN → DIRECT（生成器负责）
rule_groups:
  - id: cn
    name: "🇨🇳 国内"
    target: DIRECT
    geosite: [cn]
    files:
      - rules/cn-direct.list
  - id: academic
    name: "🎓 学术/AI"
    geosite: [openai, anthropic, github]
    files:
      - rules/academic-ai.list
  - id: media
    name: "🌍 媒体/社交"
    geosite: [youtube, netflix, disney, spotify, telegram, twitter, x, facebook,
              instagram, tiktok, twitch, reddit, discord, pinterest, linkedin,
              whatsapp, line, vimeo, tumblr, dailymotion, medium, quora]
    files:
      - rules/media.list
  - id: google
    name: "🌐 Google/Apple"
    geosite: [google, apple]
  - id: catchall
    name: "🕸️ 漏网之鱼"
    is_catchall: true   # MATCH 兜底

# 国家池：按节点名正则分类（节点命名必须含国家标识）
# 每个国家会生成一个 url-test 组（该国节点中最快）
countries:
  - name: "🇯🇵 日本"
    match: "(?i)日本|jp"
  - name: "🇸🇬 新加坡"
    match: "(?i)新加坡|sg"
  - name: "🇺🇸 美国"
    match: "(?i)美国|us"
  - name: "🇭🇰 香港"
    match: "(?i)香港|hk"

# 每个业务组统一提供三种选择模式
# 🚀 自动 = url-test(全部节点)；🌏 国家 = select(国家) → url-test(该国节点)
# 🎯 手动 = select → fallback(主→备→自动)
modes:
  auto:
    name: "🚀 自动"
    type: url-test
  country:
    name: "🌏 国家"
    type: select
  manual:
    name: "🎯 手动"
    type: select
    failover_type: fallback
    # 故障转移链：主节点 → 备用节点 1 → 备用节点 2 → 🚀 自动（全节点兜底）
    # 主/备用节点由用户在生成时指定；fallback 永远选第一个健康节点，主恢复自动切回
    failover_chain:
      - "主节点（用户指定）"
      - "备用节点 1"
      - "备用节点 2"
      - "🚀 自动"

# 客户端格式兼容：同一套规则，按客户端输出对应格式
# 生成器据此决定每个客户端如何消费本仓库规则
clients:
  mihomo:            # Nikki / Clash.Meta / Clash Verge
    rules: "GEOSITE,<类目> 直写 + rules/*.list 展开为 DOMAIN-SUFFIX"
    rule_sets: "rule-sets/*.list 可作 rule-provider（yaml）"
  sing-box:          # sing-box 1.8+
    rules: "geosite:<类目>（内置 geosite.db）或 rule_set 引用 rule-sets/*.list"
  surge:             # Surge / Stash / Shadowrocket
    rules: "RULE-SET,https://<repo>/rule-sets/<组>.list,<业务组>"
  quantumult_x:
    rules: "filter 远程引用 rule-sets/*.list（转 host-suffix）"
