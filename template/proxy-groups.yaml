# ============================================================================
# EdgeTunnel 分流组结构模板：全局自动 / 国家自动 / 手动逐节点选择。
# ============================================================================
proxy-groups:
  - name: "🚀 自动"
    type: url-test
    use: [edge]
    filter: ".*"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇯🇵 日本"
    type: url-test
    use: [edge]
    filter: "(?i)日本|jp"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇸🇬 新加坡"
    type: url-test
    use: [edge]
    filter: "(?i)新加坡|sg"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇺🇸 美国"
    type: url-test
    use: [edge]
    filter: "(?i)美国|us"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇩🇪 德国"
    type: url-test
    use: [edge]
    filter: "(?i)德国|de"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🇳🇱 荷兰"
    type: url-test
    use: [edge]
    filter: "(?i)荷兰|nl"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "🎯 手动"
    type: select
    use: [edge]
    proxies: ["🚀 自动", "🇯🇵 日本", "🇸🇬 新加坡", "🇺🇸 美国", "🇩🇪 德国", "🇳🇱 荷兰"]

  - name: "🎓 学术/AI"
    type: select
    proxies: ["🚀 自动", "🇯🇵 日本", "🇸🇬 新加坡", "🇺🇸 美国", "🇩🇪 德国", "🇳🇱 荷兰", "🎯 手动"]

  - name: "🌍 媒体/社交"
    type: select
    proxies: ["🚀 自动", "🇯🇵 日本", "🇸🇬 新加坡", "🇺🇸 美国", "🇩🇪 德国", "🇳🇱 荷兰", "🎯 手动"]

  - name: "🌐 Google/Apple"
    type: select
    proxies: ["🚀 自动", "🇯🇵 日本", "🇸🇬 新加坡", "🇺🇸 美国", "🇩🇪 德国", "🇳🇱 荷兰", "🎯 手动"]

  - name: "🕸️ 漏网之鱼"
    type: select
    proxies: ["🚀 自动", "🇯🇵 日本", "🇸🇬 新加坡", "🇺🇸 美国", "🇩🇪 德国", "🇳🇱 荷兰", "🎯 手动"]
